<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomato Crush Moment - 토마토마</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Poppins:wght@400;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", "Noto Sans KR", sans-serif;
        }

        section {
            position: relative;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #ffffff; 
            padding: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header .logo {
            position: relative;
            max-width: 65px; 
        }
        
        header .logo img {
            width: 100%;
        }

        header ul {
            position: relative;
            display: flex;
        }

        header ul li {
            list-style: none;
        }

        header ul li a {
            display: inline-block;
            color: #555;
            margin-left: 40px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        header ul li a:hover {
            color: #d32f2f; 
        }

        .content {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        /* 왼쪽 텍스트/이미지 영역 */
        .content .textBox {
            position: relative;
            max-width: 550px; 
        }

        /* 메인 타이틀 이미지 스타일 */
        .content .textBox .main-title-img {
            display: block;
            width: 100%;
            max-width: 520px; /* 화면에 맞춰 타이틀 전체 이미지 크기 조절 */
            height: auto;
        }

        /* LEARN MORE 버튼 스타일 */
        .content .textBox a {
            display: inline-block;
            margin-top: 30px; /* 타이틀 이미지 바로 아래에 적당한 간격 배치 */
            padding: 14px 45px;
            background: #d32f2f;
            color: #fff;
            border-radius: 15px; 
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
            transition: transform 0.3s, background 0.3s;
        }

        .content .textBox a:hover {
            background: #b71c1c;
            transform: translateY(-3px);
        }

        /* 오른쪽 메인 이미지 영역 */
        .content .imgBox {
            position: relative;
            width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 50px;
        }

        .content .imgBox .main-icecream {
            max-width: 320px;
            transform: rotate(-15deg); 
            filter: drop-shadow(10px 15px 25px rgba(0,0,0,0.15));
            z-index: 2;
        }

        .content .imgBox .price-tag {
            position: absolute;
            bottom: -30px;
            right: -20px;
            max-width: 140px;
            z-index: 3;
            filter: drop-shadow(5px 5px 10px rgba(0,0,0,0.1));
        }

        /* 하단 다른 토마토 제품들 */
        .thumb {
            position: absolute;
            bottom: 40px;
            left: 100px; 
            display: flex;
            align-items: flex-end;
        }

        .thumb li {
            list-style: none;
            margin-right: 25px;
            cursor: pointer;
            transition: .3s;
        }

        .thumb li:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .thumb li img {
            max-height: 80px; 
            object-fit: contain;
        }

        /* 우측 SNS 아이콘 영역 */
        .sci {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .sci li {
            list-style: none;
            margin: 12px 0;
        }
        
        .sci li a img {
            width: 20px; 
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        .sci li a :hover img {
            opacity: 1;
        }

        /* 우측 배경 녹색 대형 그래픽 */
        .circle {
            position: absolute;
            top: 0;
            right: 0;
            width: 45%;
            height: 100%;
            background-color: #9ccc65; 
            border-radius: 60% 0% 0% 40% / 50% 0% 0% 50%;
            z-index: 1;
        }

    </style>
</head>
<body>
    
    <section>
        <div class="circle"></div>

        <header>
            <a href="#" class="logo"><img src="./tomato-rogo.png" alt="Tomato Logo"></a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Menu</a></li>
                <li><a href="#">What's New</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </header>

        <div class="content">
            <div class="textBox">
                <img src="./title.png" alt="Your New Tomato Crush Moment" class="main-title-img">
                
                <a href="#">LEARN MORE</a>
            </div>

            <div class="imgBox">
                <img src="./tomatoma1.png" alt="토마토마 아이스크림" class="main-icecream">
                <img src="./tomatoma2.png" alt="800원 가격표" class="price-tag">
            </div>
        </div>

        <ul class="thumb">
            <li><img src="./temp-product1.png" alt="토마토 마이쮸"></li>
            <li><img src="./temp-product2.png" alt="토마토 프레첼"></li>
            <li><img src="./temp-product3.png" alt="토마토 젤리"></li>
        </ul>

        <ul class="sci">
            <li><a href="#"><img src="./temp-twitter.png" alt="Twitter"></a></li>
            <li><a href="#"><img src="./temp-facebook.png" alt="Facebook"></a></li>
            <li><a href="#"><img src="./temp-instagram.png" alt="Instagram"></a></li>
        </ul>
    </section>

</body>
</html>
